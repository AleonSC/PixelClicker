<title>Pixel Clicker Code Map</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
/* Layout: a full-height workbench - a narrow index rail on the left (search, areas, the selected script's card), the live map filling the rest. */
:root {
  --bg: #eef1f4; --panel: #ffffff; --ink: #18202b; --dim: #5d6876; --line: #c9d1da; --accent: #1d6fd6; --edge: rgba(40, 60, 90, 0.10); --edge-hi: rgba(29, 111, 214, 0.75);
  --display: "Archivo", "Helvetica Neue", Arial, sans-serif; --mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f141b; --panel: #161d27; --ink: #e3e8ef; --dim: #8b97a7; --line: #2a3443; --accent: #5aa2ff; --edge: rgba(170, 195, 230, 0.08); --edge-hi: rgba(90, 162, 255, 0.85); color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0f141b; --panel: #161d27; --ink: #e3e8ef; --dim: #8b97a7; --line: #2a3443; --accent: #5aa2ff; --edge: rgba(170, 195, 230, 0.08); --edge-hi: rgba(90, 162, 255, 0.85); color-scheme: dark }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--display); }
.app { display: grid; grid-template-columns: 340px 1fr; height: 100%; }
aside { background: var(--panel); border-right: 1px solid var(--line); overflow-y: auto; padding-block: 18px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: 16px; display: flex; flex-direction: column; gap: 16px; min-width: 0; }
h1 { font-size: 1.25rem; font-weight: 800; letter-spacing: -0.01em; margin: 0; text-wrap: balance; }
.sub { color: var(--dim); font-size: 0.82rem; line-height: 1.45; margin: 4px 0 0; }
.sub b { font-family: var(--mono); font-weight: 600; color: var(--ink); }
label.lbl { font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--dim); font-weight: 600; display: block; margin-bottom: 6px; }
input[type=search] { width: 100%; box-sizing: border-box; font: 0.9rem var(--mono); padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--ink); }
input[type=search]:focus-visible, button:focus-visible, .chip:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.results { display: flex; flex-direction: column; gap: 2px; margin-top: 6px; }
.results button { text-align: left; font: 0.82rem var(--mono); background: none; border: 0; color: var(--ink); padding: 4px 6px; border-radius: 4px; cursor: pointer; }
.results button:hover { background: var(--bg); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; align-items: center; gap: 6px; font-size: 0.76rem; padding: 4px 8px; border: 1px solid var(--line); border-radius: 999px; background: var(--panel); color: var(--ink); cursor: pointer; font-family: var(--display); }
.chip i { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
.chip span { color: var(--dim); font-family: var(--mono); font-size: 0.7rem; }
.chip.off { opacity: 0.38; }
.row { display: flex; gap: 8px; align-items: center; font-size: 0.82rem; color: var(--dim); }
.row input { accent-color: var(--accent); }
.card { border: 1px solid var(--line); border-radius: 8px; padding: 14px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.card h2 { font: 600 1rem var(--mono); margin: 0; word-break: break-word; }
.card .grp { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.08em; font-weight: 600; }
.card p { margin: 0; font-size: 0.84rem; line-height: 1.5; color: var(--ink); overflow-wrap: anywhere; }
.card .meta { font: 0.74rem var(--mono); color: var(--dim); font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.card h3 { font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--dim); margin: 4px 0 0; font-weight: 600; }
.links { display: flex; flex-wrap: wrap; gap: 4px; }
.links button { font: 0.72rem var(--mono); border: 1px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 4px; padding: 2px 6px; cursor: pointer; }
.links button:hover { border-color: var(--accent); }
.empty { color: var(--dim); font-size: 0.84rem; line-height: 1.5; }
main { position: relative; min-width: 0; overflow: hidden; }
svg { width: 100%; height: 100%; display: block; cursor: grab; }
svg:active { cursor: grabbing; }
.node circle { stroke: var(--panel); stroke-width: 1.5px; cursor: pointer; }
.node text { font: 10px var(--mono); fill: var(--ink); pointer-events: none; paint-order: stroke; stroke: var(--bg); stroke-width: 3px; }
.grouplabel { font: 800 15px var(--display); fill: var(--dim); opacity: 0.55; pointer-events: none; text-transform: uppercase; letter-spacing: 0.06em; }
.hint { position: absolute; right: max(12px, env(safe-area-inset-right, 0px)); bottom: 12px; font-size: 0.74rem; color: var(--dim); background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; }
.zoombtns { position: absolute; right: max(12px, env(safe-area-inset-right, 0px)); top: 12px; display: flex; gap: 6px; }
.zoombtns button { font: 600 0.9rem var(--display); width: 34px; height: 34px; border-radius: 6px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); cursor: pointer; }
.zoombtns button.wide { width: auto; padding: 0 10px; font-size: 0.78rem; }
@media (max-width: 760px) {
  .app { grid-template-columns: 1fr; grid-template-rows: auto 70vh; height: auto; }
  aside { border-right: 0; border-bottom: 1px solid var(--line); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="app">
  <aside>
    <div>
      <h1>Pixel Clicker Code Map</h1>
      <p class="sub" id="summary"></p>
    </div>
    <div>
      <label class="lbl" for="q">Find a script</label>
      <input type="search" id="q" placeholder="PixelRecycler, shop, husk..." autocomplete="off">
      <div class="results" id="results"></div>
    </div>
    <div>
      <label class="lbl">Areas (click to show / hide)</label>
      <div class="chips" id="chips"></div>
    </div>
    <div style="display:flex;flex-direction:column;gap:6px">
      <label class="row"><input type="checkbox" id="hubs" checked> Hide links to shared helpers (used by 40+ scripts)</label>
      <label class="row"><input type="checkbox" id="labels"> Show every name</label>
    </div>
    <div id="detail"><div class="empty">Click a script on the map to see what it is, what it uses and what uses it. Scroll to zoom, drag to pan.</div></div>
  </aside>
  <main>
    <svg id="map" role="img" aria-label="Map of the game's scripts, grouped by area, with lines for code that uses other code"></svg>
    <div class="zoombtns"><button id="zin" aria-label="Zoom in">+</button><button id="zout" aria-label="Zoom out">−</button><button id="zfit" class="wide">Fit</button></div>
    <div class="hint">Circle size = lines of code · lines = "uses"</div>
  </main>
</div>

(the Junction Box's top opening) that shines a WIDE red aim beam up out of it while the device is placed or carried (PixelAimLaser.Openings).","doc":"in the header comment of `PixelAimOpening.cs`","group":"UI"},{"id":"PixelAnglerVendor","files":["PixelAnglerVendor.cs"],"lines":60,"desc":"The Angler (id angler, 'Old Salt the Angler'): a goods buyer for Fishing's goods; visits while Fishing is trained or when called.","doc":"in the header comment of `PixelAnglerVendor.cs`","group":"Characters and visitors"},{"id":"PixelArcGraphic","files":["PixelArcGraphic.cs"],"lines":89,"desc":"A UI Graphic that draws a curved band with round caps and soft edges as a mesh (the Block Hold meter's track, glow and fill).","doc":"in the header comment of `PixelArcGraphic.cs`","group":"Effects"},{"id":"PixelArcRing","files":["PixelArcRing.cs"],"lines":30,"desc":"Makes a full PixelArcGraphic ring (switched off, given an anchor); used by PixelGoldenSnitch and PixelPowerClick.","doc":"in the header comment of `PixelArcRing.cs`","group":"UI"},{"id":"PixelAttachment","files":["PixelAttachment.cs"],"lines":302,"desc":"Sticking husks to each other in first person build mode: the snap maths, the glue and prying them off.","doc":"in the header comment of `PixelAttachment.cs`","group":"Devices and factory"},{"id":"PixelAudio","files":["PixelAudio.cs","PixelAudioCues.cs","PixelAudioSounds.cs"],"lines":1338,"desc":"The main-menu UFO's abduction plays ufo_beam (code-made PixelSynth.UfoBeam:","doc":"in the header comment of `PixelAudio.cs`","group":"Sound"},{"id":"PixelAudioSynth","files":["PixelAudioSynth.cs"],"lines":679,"desc":"Part of PixelSynth (static partial, in PixelAudio): the block / gathering / device synth sounds (Bloop ... Dig).","doc":"in the header comment of `PixelAudio.cs`","group":"Sound"},{"id":"PixelAudioSynthShows","files":["PixelAudioSynthShows.cs"],"lines":623,"desc":"Part of PixelSynth (static partial, in PixelAudio): the hold / menu / chest / Dragon Cube / fire / ore / ghost / UFO / star synth sounds and Normalize.","doc":"in the header comment of `PixelAudio.cs`","group":"Sound"},{"id":"PixelAutoClicker","files":["PixelAutoClicker.cs"],"lines":134,"desc":"Timer that calls clicker.AutoCollect() (paused while a takeover minigame runs or the cube is shrunk away:","doc":"in the header comment of `PixelAutoClicker.cs`","group":"Core loop"},{"id":"PixelAutosaves","files":["PixelAutosaves.cs"],"lines":526,"desc":"Autosave history (the last 100 timer autosaves kept in <persistentDataPath>/Autosaves, oldest replaced first; opened from the small 'Autosaves' button in the Save / Load window) + a screenshot saved next to EVERY save and shown in the hover tooltips (PixelSaveShots).","doc":"in the header comment of `PixelAutosaves.cs`","group":"Save and settings"},{"id":"PixelAxeSynth","files":["PixelAxeSynth.cs"],"lines":164,"desc":"Code-made sounds for the first person axe and the Great Oak's bird nests (axe_swing, axe_chop, nest_fall, nest_catch, tree_creak).","doc":"in the header comment of `PixelAxeSynth.cs`","group":"Sound"},{"id":"PixelBait","files":["PixelBait.cs"],"lines":152,"desc":"","doc":"","group":"Devices and factory"},{"id":"PixelBaitBucket","files":["PixelBaitBucket.cs"],"lines":380,"desc":"Bait Bucket consumable (DeviceKind.BaitBucket, Supplies): right-click it in Fishing and a bucket appears at a fixed floor spot (drag its bail to move it) until you stop Fishing; it stores Fish / Water husks dropped in (stored fish raise Fish's spawn weight via PixelBait.FishMultiplier).","doc":"in the header comment of `PixelBaitBucket.cs`","group":"Devices and factory"},{"id":"PixelBalanceReport","files":["PixelBalanceReport.cs"],"lines":281,"desc":"Dev tool (Dev Tools > Tools > 'Balance report'): a text report for pasting into any AI (per-skill XP/click, minutes to level at manual / auto speed, pay per click, outliers, Inspector levers, CSV); it previews each pack through `PixelSkills.PreviewPackId` / `PreviewLevel` so it uses the game's own spawn shares.","doc":"in the header comment of `PixelBalanceReport.cs`","group":"Dev tools"},{"id":"PixelBank","files":["PixelBank.cs"],"lines":1473,"desc":"Pixel Bank (shop pack with unlocksBank, Upgrades tab):","doc":"`docs/systems/PixelBank.md`","group":"Core loop"},{"id":"PixelBarEdgeFx","files":["PixelBarEdgeFx.cs"],"lines":279,"desc":"Bar styles (Settings > Display 'Bar style', PixelBarStyle.Current): what glows along the black bars' inner edge - Neon glow, Pixel equalizer (audio-reactive pixel columns), Pixel wave, Marquee, Scanner, Thin line; one PixelBarEdgeFx per edge, ticked by PixelHud and PixelTitleScreen.","doc":"in the header comment of `PixelBarEdgeFx.cs`","group":"Effects"},{"id":"PixelBarGlow","files":["PixelBarGlow.cs"],"lines":85,"desc":"Shared drawing helpers for the neon LED-strip glow along the black bars' edges (title screen and HUD bars).","doc":"`PixelBarGlow.cs` (class summary)","group":"Effects"},{"id":"PixelBasicFx","files":["PixelBasicFx.cs"],"lines":132,"desc":"Small click feedback for every pixel type: a few tiny squares pop off in the pixel's colour (light for the auto clicker, Settings > Interface > Click effects), on the shared PixelFx burst pool.","doc":"`PixelBasicFx.cs` (class summary)","group":"Effects"},{"id":"PixelBeanMinigame","files":["PixelBeanMinigame.cs"],"lines":416,"desc":"Two very rare cat visitors (ids egg, bean;","doc":"`docs/systems/PixelEggMinigame.md`","group":"Characters and visitors"},{"id":"PixelBeltJump","files":["PixelBeltJump.cs"],"lines":300,"desc":"Belt Jump (tester feature): a launch ramp clipped onto a belt END and a landing ramp straight across a scroll-set gap; husks are thrown over in a fixed arc and put onto a belt starting at the landing end.","doc":"in the header comment of `PixelBeltJump.cs`","group":"Devices and factory"},{"id":"PixelBeltSorter","files":["PixelBeltSorter.cs"],"lines":444,"desc":"Belt Sorter (tester feature): a gantry placed on a conveyor belt with a filter slot (drop a block on its tray) that kicks every pixel of that type off its side (or onto a belt starting there); right click swaps sides.","doc":"in the header comment of `PixelBeltSorter.cs`","group":"Devices and factory"},{"id":"PixelBiomassGenerator","files":["PixelBiomassGenerator.cs"],"lines":383,"desc":"Pocket Biomass Generator (DeviceKind 27, shop Consumables) and Biomass Generator (28, Woodcutting 10): burn Woodcutting husks (firebox on top / intake coupling) to POWER every placed device in a radius (timers stop, they show its blue energy bar); come full, drain, flash red when empty, then disappear unless fed.","doc":"in the header comment of `PixelBiomassGenerator.cs`","group":"Devices and factory"},{"id":"PixelBlackholeMinigame","files":["PixelBlackholeMinigame.cs"],"lines":825,"desc":"Black hole minigame (Minigames tab, a pack with unlocksMinigame = \"blackhole\"):","doc":"in the header comment of `PixelBlackholeMinigame.cs`","group":"Minigames"},{"id":"PixelBlinkMinigame","files":["PixelBlinkMinigame.cs"],"lines":314,"desc":"Cube Blink minigame (id blink, pack unlocksMinigame = \"blink\", Minigames tab, 3.5K each;","doc":"in the header comment of `PixelBlinkMinigame.cs`","group":"Minigames"},{"id":"PixelBlockArt","files":["PixelBlockArt.cs"],"lines":61,"desc":"The code-drawn character art helpers: Block (one plain coloured square from a given anchor) and WalkerHolder (the holder a menu walks a character about in); used by PixelVisitorMinigame (all vendors), PixelGuideVendor, PixelCubiePeek and PixelDragonWish.","doc":"in the header comment of `PixelBlockArt.cs`","group":"UI"},{"id":"PixelBlockCatalog","files":["PixelBlockCatalog.cs"],"lines":292,"desc":"The block catalog: one card per pixel type with its TAGS (Wood, Hazard, Standalone, Ore... read by IsWoodBlock / IsHazard / IsStandalone etc.), its Pixel Guide text, its husk text, and optional soundAs / fxAs (borrow another block's sounds / break burst). A new block = one card here.","doc":"in the header comment of `PixelBlockCatalog.cs`","group":"Core loop"},{"id":"PixelBlockHold","files":["PixelBlockHold.cs"],"lines":856,"desc":"Block Hold (unlocked by the Standard skill tree node 'hold'): hold the right mouse button on the cube's block to pull it out of the rotation while a meter drains; letting go puts it back. Holding a plain block also puts a growing STAKE on it (pays more, or nothing, when it comes round again).","doc":"in the header comment of `PixelBlockHold.cs`","group":"Core loop"},{"id":"PixelBlockRules","files":["PixelBlockRules.cs"],"lines":416,"desc":"Shared foundation for SPECIAL blocks (rare replacements of rolled blocks, e.g. Great Oak) and HOLD blocks (bonus while held with Block Hold, e.g. Whetstone): two data lists of rules.","doc":"`docs/systems/PixelBlockRules.md`","group":"Core loop"},{"id":"PixelBlockTags","files":["PixelBlockTags.cs"],"lines":36,"desc":"The block catalog: one card per pixel type with its TAGS (Wood, Hazard, Standalone, Ore... read by IsWoodBlock / IsHazard / IsStandalone etc.), its Pixel Guide text, its husk text, and optional soundAs / fxAs (borrow another block's sounds / break burst). A new block = one card here.","doc":"in the header comment of `PixelBlockCatalog.cs`","group":"Core loop"},{"id":"PixelBlockTextures","files":["PixelBlockTextures.cs"],"lines":501,"desc":"Filler blocks / base block textures (PixelSkills.TryGetFiller, PixelClicker.FillerInfo, PixelBlockTextures.cs) Each skill pack can have a 'useless' FILLER block (SkillPack.fillerType = a pixel type name; Farming = Dirt, Mining = Stone, the old Rock block (enum PixelType.Rock kept for saves, now called Stone everywhere in the UI), which is now part of Mining's pixel list, unlocked with the first ore (Wood is part of W","doc":"","group":"Core loop"},{"id":"PixelBlockTooltip","files":["PixelBlockTooltip.cs"],"lines":646,"desc":"Block hover tooltip (added by PixelClicker.Awake;","doc":"in the header comment of `PixelBlockTooltip.cs`","group":"UI"},{"id":"PixelBody","files":["PixelBody.cs"],"lines":41,"desc":"ONE version-safe Rigidbody velocity helper (Velocity / SetVelocity(stopSpin) / Steer = skips null or kinematic bodies); use it instead of a new #if UNITY_6000_0_OR_NEWER block.","doc":"in the header comment of `PixelBody.cs`","group":"Husks"},{"id":"PixelBolts","files":["PixelBolts.cs"],"lines":79,"desc":"Electric pixel abilities (both components added by PixelClicker.Awake).","doc":"`docs/systems/PixelOvercharge.md`","group":"Effects"},{"id":"PixelBombMinigame","files":["PixelBombMinigame.cs"],"lines":625,"desc":"Bomb Defusal minigame (pack unlocksMinigame = \"bomb\", Minigames tab):","doc":"in the header comment of `PixelBombMinigame.cs`","group":"Minigames"},{"id":"PixelBottleMap","files":["PixelBottleMap.cs"],"lines":95,"desc":"The Message in a Bottle block's look: a pale green glass cube with a small 3D treasure map floating inside (PixelLook.bottleMap).","doc":"in the header comment of `PixelBottleMap.cs`","group":"UI"},{"id":"PixelBoundsSnapshot","files":["PixelBoundsSnapshot.cs"],"lines":107,"desc":"Dev tool (Dev Tools > Tools > 'Snapshot bounds') that writes the camera / view / cube / floor / PixelViewBounds numbers and where the viewport edges land on the floor to <persistentDataPath>/Snapshots + clipboard + screenshot, for tuning the pixel bounds.","doc":"in the header comment of `PixelBoundsSnapshot.cs`","group":"Dev tools"},{"id":"PixelBreakoutMinigame","files":["PixelBreakoutMinigame.cs"],"lines":678,"desc":"Breakout minigame (id breakout, pack unlocksMinigame = \"breakout\", Minigames tab;","doc":"in the header comment of `PixelBreakoutMinigame.cs`","group":"Minigames"},{"id":"PixelClicker","files":["PixelBurstPop.cs","PixelClicker.cs","PixelClickerAnimation.cs","PixelClickerClick.cs","PixelClickerCurrency.cs","PixelClickerDatabase.cs","PixelClickerHazards.cs","PixelClickerHusks.cs","PixelClickerLookFixups.cs","PixelClickerLooks.cs","PixelClickerNumbers.cs","PixelClickerPointer.cs","PixelClickerSkillBlocks.cs","PixelClickerT   function placeLabels() {
    groupLabel.each(function (g) {
      const ns = nodes.filter(n => n.group === g); if (!ns.length) return;
      const x = ns.reduce((s, n) => s + n.x, 0) / ns.length, y = Math.min(...ns.map(n => n.y - n.r));
      d3.select(this).attr('x', x).attr('y', y - 12);
    });
  }

  let linkSel = gLinks.selectAll('line'), nodeSel = gNodes.selectAll('g');
  const visibleNode = n => !hidden.has(n.group);
  function visibleLinks() {
    const hideHubs = document.getElementById('hubs').checked;
    return links.filter(l => {
      const s = typeof l.source === 'object' ? l.source : byId.get(l.source), t = typeof l.target === 'object' ? l.target : byId.get(l.target);
      if (!visibleNode(s) || !visibleNode(t)) return false;
      if (hideHubs && t.inDeg >= HUB && !(selected && (s.id === selected.id || t.id === selected.id))) return false;
      return true;
    });
  }

  const sim = d3.forceSimulation(nodes)
    .force('link', d3.forceLink(links).id(d => d.id).strength(0.006).distance(60))
    .force('charge', d3.forceManyBody().strength(-38))
    .force('collide', d3.forceCollide(d => d.r + 2))
    .force('x', d3.forceX(d => centre.get(d.group).x).strength(0.32))
    .force('y', d3.forceY(d => centre.get(d.group).y).strength(0.32))
    .on('tick', ticked);

  function render() {
    const vl = visibleLinks();
    linkSel = gLinks.selectAll('line').data(vl, d => d.source.id + '>' + d.target.id).join('line').attr('stroke-width', 1);
    const vn = nodes.filter(visibleNode);
    nodeSel = gNodes.selectAll('g.node').data(vn, d => d.id).join(enter => {
      const g = enter.append('g').attr('class', 'node').attr('tabindex', 0).attr('role', 'button').attr('aria-label', d => d.id);
      g.append('circle').attr('r', d => d.r).attr('fill', d => DATA.colors[d.group] || '#888');
      g.append('text').attr('x', d => d.r + 3).attr('y', 3).text(d => d.id.replace(/^Pixel/, ''));
      g.append('title').text(d => d.id + ' (' + d.lines + ' lines)');
      g.on('click', (e, d) => { e.stopPropagation(); select(d); })
       .on('keydown', (e, d) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); select(d); } });
      g.call(d3.drag().on('start', (e, d) => { if (!e.active) sim.alphaTarget(0.2).restart(); d.fx = d.x; d.fy = d.y; })
        .on('drag', (e, d) => { d.fx = e.x; d.fy = e.y; })
        .on('end', (e, d) => { if (!e.active) sim.alphaTarget(0); d.fx = null; d.fy = null; placeLabels(); }));
      return g;
    });
    groupLabel.style('display', g => hidden.has(g) ? 'none' : null);
    style();
    ticked();
  }

  function style() {
    const showAll = document.getElementById('labels').checked;
    const near = new Set();
    if (selected) { near.add(selected.id); uses.get(selected.id).forEach(x => near.add(x)); usedBy.get(selected.id).forEach(x => near.add(x)); }
    const k = currentZoom;
    nodeSel.style('opacity', d => !selected || near.has(d.id) ? 1 : 0.15);
    nodeSel.select('circle').attr('stroke', d => selected && d.id === selected.id ? 'var(--ink)' : 'var(--panel)').attr('stroke-width', d => selected && d.id === selected.id ? 3 : 1.5);
    nodeSel.select('text').style('display', d => showAll || (selected ? near.has(d.id) : (d.lines > 1400 || k > 1.6 || (k > 1.1 && d.lines > 500))) ? null : 'none');
    linkSel.attr('stroke', d => selected && (d.source.id === selected.id || d.target.id === selected.id) ? 'var(--edge-hi)' : 'var(--edge)')
      .style('display', d => !selected || d.source.id === selected.id || d.target.id === selected.id ? null : 'none');
  }

  function ticked() {
    linkSel.attr('x1', d => d.source.x).attr('y1', d => d.source.y).attr('x2', d => d.target.x).attr('y2', d => d.target.y);
    nodeSel.attr('transform', d => `translate(${d.x},${d.y})`);
  }

  // ---- zoom ----
  let currentZoom = 1;
  const zoom = d3.zoom().scaleExtent([0.15, 6]).on('zoom', e => { root.attr('transform', e.transform); const was = currentZoom; currentZoom = e.transform.k; if (Math.abs(was - currentZoom) > 0.05) style(); });
  svg.call(zoom).on('click', () => select(null));
  function fit(ms) {
    const el = svg.node(), w = el.clientWidth || 800, h = el.clientHeight || 600;
    const vn = nodes.filter(visibleNode); if (!vn.length) return;
    const xs = vn.map(n => n.x), ys = vn.map(n => n.y);
    const x0 = Math.min(...xs) - 90, x1 = Math.max(...xs) + 90, y0 = Math.min(...ys) - 50, y1 = Math.max(...ys) + 30;
    const k = Math.min(w / (x1 - x0), h / (y1 - y0), 2.5);
    svg.transition().duration(ms).call(zoom.transform, d3.zoomIdentity.translate(w / 2, h / 2).scale(k).translate(-(x0 + x1) / 2, -(y0 + y1) / 2));
  }
  document.getElementById('zin').onclick = () => svg.transition().duration(250).call(zoom.scaleBy, 1.4);
  document.getElementById('zout').onclick = () => svg.transition().duration(250).call(zoom.scaleBy, 1 / 1.4);
  document.getElementById('zfit').onclick = () => fit(400);

  // ---- the selected script's card ----
  function linkButtons(ids) {
    return ids.slice().sort((a, b) => byId.get(b).inDeg - byId.get(a).inDeg || a.localeCompare(b))
      .map(id => `<button data-id="${id}" style="border-left:3px solid ${DATA.colors[byId.get(id).group]}">${id.replace(/^Pixel/, '')}</button>`).join('');
  }
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  function select(n) {
    selected = n;
    const box = document.getElementById('detail');
    if (!n) {
      box.innerHTML = '<div class="empty">Click a script on the map to see what it is, what it uses and what uses it. Scroll to zoom, drag to pan.</div>';
    } else {
      if (hidden.has(n.group)) { hidden.delete(n.group); drawChips(); }
      const u = uses.get(n.id), b = usedBy.get(n.id);
      box.innerHTML = `<div class="card">
        <div class="grp" style="color:${DATA.colors[n.group]}">${esc(n.group)}</div>
        <h2>${esc(n.id)}</h2>
        <div class="meta">${n.files.map(esc).join(', ')} · ${n.lines.toLocaleString('en-US')} lines</div>
        <p>${esc(n.desc || 'No description yet (add a header comment or a docs/Index.md line).')}</p>
        ${n.doc ? `<div class="meta">Details: ${esc(n.doc.replace(/`/g, ''))}</div>` : ''}
        <h3>Uses (${u.length})</h3><div class="links">${linkButtons(u) || '<span class="meta">nothing else</span>'}</div>
        <h3>Used by (${b.length})</h3><div class="links">${linkButtons(b) || '<span class="meta">no other script</span>'}</div>
      </div>`;
      box.querySelectorAll('button[data-id]').forEach(btn => btn.onclick = () => focusOn(byId.get(btn.dataset.id)));
    }
    render();
  }
  function focusOn(n) {
    select(n);
    const el = svg.node(), w = el.clientWidth, h = el.clientHeight, k = Math.max(currentZoom, 1.3);
    svg.transition().duration(450).call(zoom.transform, d3.zoomIdentity.translate(w / 2, h / 2).scale(k).translate(-n.x, -n.y));
  }

  // ---- areas ----
  function drawChips() {
    const box = document.getElementById('chips');
    box.innerHTML = groups.map(g => `<button class="chip${hidden.has(g) ? ' off' : ''}" data-g="${esc(g)}" aria-pressed="${!hidden.has(g)}"><i style="background:${DATA.colors[g]}"></i>${esc(g)} <span>${nodes.filter(n => n.group === g).length}</span></button>`).join('');
    box.querySelectorAll('.chip').forEach(c => c.onclick = e => {
      const g = c.dataset.g;
      if (e.shiftKey || e.altKey) { const solo = hidden.size === groups.length - 1 && !hidden.has(g); hidden.clear(); if (!solo) groups.forEach(x => { if (x !== g) hidden.add(x); }); }
      else if (hidden.has(g)) hidden.delete(g); else hidden.add(g);
      if (selected && hidden.has(selected.group)) selected = null;
      drawChips(); render();
    });
  }
  drawChips();

  // ---- search ----
  const q = document.getElementById('q'), results = document.getElementById('results');
  q.addEventListener('input', () => {
    const t = q.value.trim().toLowerCase();
    if (!t) { results.innerHTML = ''; return; }
    const hits = nodes.filter(n => n.id.toLowerCase().includes(t) || n.files.some(f => f.toLowerCase().includes(t)) || (n.desc || '').toLowerCase().includes(t))
      .sort((a, b) => (b.id.toLowerCase().includes(t)) - (a.id.toLowerCase().includes(t)) || b.lines - a.lines).slice(0, 12);
    results.innerHTML = hits.map(n => `<button data-id="${n.id}"><span style="color:${DATA.colors[n.group]}">●</span> ${esc(n.id)}</button>`).join('') || '<div class="empty">No script matches.</div>';
    results.querySelectorAll('button').forEach(b => b.onclick = () => focusOn(byId.get(b.dataset.id)));
  });
  q.addEventListener('keydown', e => { if (e.key === 'Enter') { const b = results.querySelector('button'); if (b) b.click(); } });
  document.getElementById('hubs').onchange = render;
  document.getElementById('labels').onchange = style;

  render();
  // Settle the layout before the first frame is shown, then fit it to the screen.
  sim.stop(); for (let i = 0; i < 300; i++) sim.tick(); ticked(); placeLabels(); fit(0);
  sim.on('end', placeLabels);
  window.addEventListener('resize', () => fit(0));
})();
</script>
